- title: Many documents
  contents:
  - gr_read_many

- title: Systematic and literature reviews
  desc: >
    From a search export to screened studies, an extraction table, a written
    review and an audit report, with the screening measured against a
    hand-screened sample.
  contents:
  - gr_protocol
  - gr_protocols
  - gr_protocol_save
  - gr_register_protocol
  - gr_search
  - gr_records
  - gr_screen
  - gr_reference
  - gr_calibrate
  - '`[.gr_reference_frame`'
  - gr_fields
  - gr_field
  - gr_extract
  - gr_claims
  - gr_outline
  - gr_gaps
  - gr_synthesise
  - gr_flow
  - gr_audit_report

- title: Cost, tokens and tracing
  contents:
  - gr_options
  - gr_estimate_cost
  - gr_count_tokens
  - gr_tokenizer
  - gr_set_tokenizer
  - gr_truncate_tokens
  - gr_budget
  - gr_trace
  - gr_trace_summary
  - gr_trace_cost
  - gr_trace_save
  - as_json

- title: Caching and replaying runs
  contents:
  - gr_cache
  - gr_cache_client
  - gr_cache_stats
  - gr_cache_clear
  - gr_replay_client

- title: Extending readgpt
  desc: >
    Every axis is a registry. An addition is used exactly like a built-in.
  contents:
  - gr_register_extractor
  - gr_register_cleaner
  - gr_register_segmenter
  - gr_register_reader
  - gr_register_embedder
  - new_chunks
  - new_answer

- title: Superseded
  desc: >
    The entry points of the first version. They still work and warn once;
    new code should use `answer_document()`, `gr_ingest()` and `gr_segment()`.
  contents:
  - answer_question
  - parse_text
  - gpt_read_chunked
  - gpt_read_hierarchical
  - gpt_read_multipass
  - gpt_read_retrieval
