url: https://elkronos.github.io/readgpt/

template:
  bootstrap: 5

articles:
- title: Guides
  navbar: Guides
  contents:
  - readgpt
  - ingest
  - readers
- title: Overview
  navbar: Overview
  contents:
  - tour

reference:
- title: Ask a question
  desc: >
    Start here. One call reads a document and answers a question, and the
    answer says what it rests on and whether anything went wrong.
  contents:
  - answer_document
  - gr_compare
  - gr_recipes
  - gr_recipe
  - gr_answer
  - is_not_found
  - readgpt_example

- title: Connect to a model
  desc: >
    Clients for OpenAI-compatible endpoints, any provider ellmer supports, any
    function you write, and an offline stand-in for practice and tests.
  contents:
  - gr_client
  - gr_api_key
  - gr_ellmer_client
  - gr_backend_client
  - gr_mock_client
  - gr_call
  - gr_result
  - gr_models
  - gr_model_info
  - gr_model_limits
  - gr_register_model

- title: Get text out of files
  desc: >
    Extraction, cleaning and a survey of a folder before anything is spent.
    See `vignette("ingest")`.
  contents:
  - gr_ingest
  - gr_ingest_spec
  - gr_document
  - gr_extractors
  - gr_cleaners
  - gr_clean
  - gr_inventory

- title: Cut documents into chunks
  contents:
  - gr_segment
  - gr_segment_spec
  - gr_segmenters
  - gr_chunks
  - gr_chunk_stats

- title: Read the chunks
  desc: >
    The reading strategies, the settings that choose and place chunks, and
    the check on quoted evidence. See `vignette("readers")`.
  contents:
  - gr_read
  - gr_read_spec
  - gr_readers
  - gr_reader_signature
  - gr_embed
  - gr_embedders
